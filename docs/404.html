<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f6f4ee" />
    <title>页面没有找到 — Weekflow</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        color: #171813;
        background: #f6f4ee;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
      }

      main { max-width: 620px; text-align: center; }

      .mark {
        width: 58px;
        height: 58px;
        display: block;
        margin: 0 auto 36px;
        border-radius: 14px;
        box-shadow: 0 7px 22px rgba(8, 31, 86, 0.2);
      }

      p { color: #696a63; font-size: 17px; line-height: 1.7; }
      h1 { margin: 0; font-size: clamp(42px, 9vw, 72px); letter-spacing: -0.055em; line-height: 1; }
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        margin-top: 20px;
        padding: 0 22px;
        border-radius: 999px;
        color: #fff;
        background: #7453d6;
        font-weight: 720;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #7453d6; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/weekflow/assets/apple-touch-icon.png" alt="" aria-hidden="true" />
      <h1>这一页不在本周计划里。</h1>
      <p>地址可能已经改变，或者这个页面还没有安排。回到 Weekflow 首页继续看看吧。</p>
      <a href="/weekflow/">返回首页</a>
    </main>
  </body>
</html>
